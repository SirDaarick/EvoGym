services:
  postgres_prod:
    image: postgres:16-alpine
    container_name: evogym-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evogym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-evogym_prod}
    volumes:
      - evogym_postgres_prod_data:/var/lib/postgresql/data
    ports:
      # In production, bind only to loopback or access via internal docker network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evogym} -d ${POSTGRES_DB:-evogym_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evogym_postgres_prod_data:
    name: evogym_postgres_prod_data
