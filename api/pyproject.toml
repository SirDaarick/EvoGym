[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evogym-api"
version = "0.1.0"
description = "EvoGym API service boundary"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.149,<1.0",
    "pydantic-settings>=2.16,<3.0",
    "SQLAlchemy>=2.1.5,<3.0",
    "alembic>=1.20,<2.0",
    "psycopg[binary]>=3.3.6,<4.0",
    "bcrypt>=5.0,<6.0",
    "uvicorn[standard]>=0.41,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1.0",
    "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
