<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvoGym — T01: Selección de Perfil de Personal</title>
  <style>
    :root {
      color-scheme: light dark;
      --eg-orange: #FC6C06;
      --eg-orange-hover: #e05e00;
      --eg-action: #A83D08;
      --eg-ink: light-dark(#202020, #FCFCFC);
      --eg-muted: light-dark(#555555, #a3a3a3);
      --eg-page: light-dark(#f4f1ed, #0e0e0e);
      --eg-surface: light-dark(#FCFCFC, #1b1b1b);
      --eg-surface-soft: light-dark(#f7f4f0, #262626);
      --eg-line: light-dark(#d7d0c8, #3a3a3a);
      --eg-clay-shadow: light-dark(
        6px 10px 24px rgba(32, 32, 32, 0.08),
        6px 10px 28px rgba(0, 0, 0, 0.45)
      );
      --eg-clay-highlight: light-dark(
        inset 1px 1px 0 rgba(255, 255, 255, 0.85),
        inset 1px 1px 0 rgba(255, 255, 255, 0.08)
      );
      --eg-focus: 0 0 0 3px rgba(252, 108, 6, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--eg-page);
      color: var(--eg-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 20px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .canvas {
      width: 100%;
      max-width: 1060px;
      background: var(--eg-surface-soft);
      border: 1px solid var(--eg-line);
      border-radius: 28px;
      padding: 28px 36px 40px;
      box-shadow: var(--eg-clay-shadow);
      display: flex;
      flex-direction: column;
      gap: 36px;
      min-height: 720px;
      position: relative;
    }

    /* Header */
    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--eg-line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--eg-ink);
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--eg-orange);
      display: grid;
      place-items: center;
      box-shadow: 2px 4px 10px rgba(252, 108, 6, 0.35);
      flex-shrink: 0;
      overflow: hidden;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-logo-fallback {
      font-weight: 800;
      color: #080808;
      font-size: 16px;
      letter-spacing: -0.5px;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-shift {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .shift-time {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .shift-tag {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--eg-orange);
      background: color-mix(in srgb, var(--eg-orange) 14%, var(--eg-surface));
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--eg-orange) 30%, transparent);
    }

    .header-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }

    .date-display {
      font-size: 13.5px;
      color: var(--eg-muted);
      font-weight: 500;
      text-align: right;
    }

    .theme-toggle {
      background: var(--eg-surface);
      border: 1px solid var(--eg-line);
      color: var(--eg-ink);
      border-radius: 12px;
      width: 44px;
      height: 44px;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--eg-clay-highlight);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .theme-toggle:hover {
      background: var(--eg-surface-soft);
      border-color: color-mix(in srgb, var(--eg-ink) 25%, var(--eg-line));
    }

    .theme-toggle:active {
      transform: translateY(1px);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .theme-toggle:focus-visible {
      outline: none;
      box-shadow: var(--eg-focus);
    }

    /* Content Area */
    .selection-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      flex: 1;
      justify-content: center;
    }

    .prompt-text {
      text-align: center;
    }

    .prompt-text h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .prompt-text p {
      font-size: 13.5px;
      color: var(--eg-muted);
    }

    /* Clay Cards Shared */
    .profile-card {
      background: var(--eg-surface);
      border: 1px solid var(--eg-line);
      border-radius: 20px;
      box-shadow: var(--eg-clay-shadow), var(--eg-clay-highlight);
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.18s ease, border-color 0.18s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      position: relative;
    }

    .profile-card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--eg-orange) 50%, var(--eg-line));
      box-shadow: 8px 14px 28px rgba(0, 0, 0, 0.12), var(--eg-clay-highlight);
    }

    .profile-card:active {
      transform: translateY(0);
      box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.1), var(--eg-clay-highlight);
    }

    .profile-card:focus-visible {
      outline: none;
      box-shadow: var(--eg-focus);
      border-color: var(--eg-orange);
    }

    /* Admin Card (Apex) */
    .admin-cluster {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .card-admin {
      width: 160px;
      height: 140px;
      padding: 18px 14px;
      gap: 10px;
    }

    .card-admin .avatar {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--eg-ink) 10%, var(--eg-surface-soft));
      border: 1px solid var(--eg-line);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--eg-ink);
    }

    .card-admin .role-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .badge-key {
      font-size: 11px;
      color: var(--eg-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Reception Cluster */
    .reception-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .reception-grid-row-1 {
      display: grid;
      grid-template-columns: repeat(4, 150px);
      gap: 16px;
      justify-content: center;
    }

    .reception-grid-row-2 {
      display: grid;
      grid-template-columns: repeat(3, 150px);
      gap: 16px;
      justify-content: center;
    }

    .card-recep {
      width: 150px;
      height: 130px;
      padding: 14px 10px;
      gap: 8px;
    }

    .card-recep .avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--eg-orange) 14%, var(--eg-surface));
      border: 1px solid color-mix(in srgb, var(--eg-orange) 30%, transparent);
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--eg-orange);
    }

    .card-recep .profile-name {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
    }

    .card-recep .profile-badge {
      font-size: 11px;
      color: var(--eg-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--eg-orange);
    }

    .badge-dot.open {
      background: #28754a;
    }

    /* Modal / PIN dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 8, 0.55);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--eg-surface);
      border: 1px solid var(--eg-line);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), var(--eg-clay-highlight);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .modal-backdrop.active .modal-card {
      transform: scale(1);
    }

    .modal-profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .modal-avatar {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: color-mix(in srgb, var(--eg-orange) 16%, var(--eg-surface));
      border: 1px solid color-mix(in srgb, var(--eg-orange) 35%, transparent);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--eg-orange);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .modal-subtitle {
      font-size: 13px;
      color: var(--eg-muted);
    }

    .pin-display {
      display: flex;
      gap: 12px;
      margin: 8px 0;
    }

    .pin-slot {
      width: 44px;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--eg-line);
      background: var(--eg-surface-soft);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
      box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.05);
      transition: border-color 0.15s ease;
    }

    .pin-slot.filled {
      border-color: var(--eg-orange);
      color: var(--eg-ink);
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 240px;
    }

    .key-btn {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 1px solid var(--eg-line);
      background: var(--eg-surface);
      color: var(--eg-ink);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.05), var(--eg-clay-highlight);
      transition: transform 0.1s ease, background 0.1s ease;
    }

    .key-btn:hover {
      background: var(--eg-surface-soft);
      transform: translateY(-1px);
    }

    .key-btn:active {
      transform: translateY(1px);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn-secondary {
      background: var(--eg-surface-soft);
      border-color: var(--eg-line);
      color: var(--eg-ink);
    }

    .btn-secondary:hover {
      background: color-mix(in srgb, var(--eg-ink) 5%, var(--eg-surface-soft));
    }

    .btn-primary {
      background: var(--eg-orange);
      color: #080808;
      box-shadow: 0 4px 12px rgba(252, 108, 6, 0.3);
    }

    .btn-primary:hover {
      background: var(--eg-orange-hover);
    }

    /* Feedback Toast */
    .toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--eg-surface);
      border: 1px solid var(--eg-orange);
      color: var(--eg-ink);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer Notes */
    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--eg-muted);
      border-top: 1px solid var(--eg-line);
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media (max-width: 780px) {
      .canvas {
        padding: 20px 18px 28px;
        min-height: auto;
      }
      .header {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 12px;
      }
      .brand, .header-shift, .header-meta {
        justify-content: center;
      }
      .reception-grid-row-1, .reception-grid-row-2 {
        grid-template-columns: repeat(2, 140px);
      }
      .footer-note {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="canvas" role="region" aria-label="Pantalla de inicio de sesión EvoGym">
    <!-- Header: Logo, Hora y Turno, Fecha -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <img src="../../Logo_Evo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span class="brand-logo-fallback" style="display:none;">EG</span>
        </div>
        <span class="brand-name">EvoGym</span>
      </div>

      <div class="header-shift">
        <div class="shift-time" id="current-time">14:35 hrs</div>
        <div class="shift-tag" id="current-shift">Turno Vespertino</div>
      </div>

      <div class="header-meta">
        <div class="date-display" id="current-date">Jueves, 10 de octubre</div>
        <button class="theme-toggle" id="theme-btn" type="button" aria-label="Alternar tema claro y oscuro" aria-pressed="false" title="Alternar tema claro y oscuro">
          <span id="theme-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          </span>
        </button>
      </div>
    </header>

    <!-- Main Selection Area -->
    <main class="selection-area">
      <div class="prompt-text">
        <h1>Elige tu perfil</h1>
        <p>Selecciona tu cuenta de personal para comenzar el turno u operaciones</p>
      </div>

      <!-- Apex: Admin Card -->
      <section class="admin-cluster" aria-label="Perfil de administración">
        <button class="profile-card card-admin" type="button" onclick="handleProfileSelect('Admin', 'ADMIN', true)">
          <div class="avatar" aria-hidden="true">A</div>
          <div class="role-name">Admin</div>
        </button>
      </section>

      <!-- Grid: Reception Profiles (4 on row 1, 3 on row 2 as in wireframe sketch) -->
      <section class="reception-cluster" aria-label="Perfiles de recepción">
        <div class="reception-grid-row-1">
          <button class="profile-card card-recep" type="button" onclick="handleProfileSelect('Valeria M.', 'RECEPTION', true)">
            <div class="avatar" aria-hidden="true">VM</div>
            <div class="profile-name">Valeria M.</div>
          </button>

          <button class="profile-card card-recep" type="button" onclick="handleProfileSelect('Carlos R.', 'RECEPTION', false)">
            <div class="avatar" aria-hidden="true">CR</div>
            <div class="profile-name">Carlos R.</div>
          </button>

          <button class="profile-card card-recep" type="button" onclick="handleProfileSelect('Sofía L.', 'RECEPTION', true)">
            <div class="avatar" aria-hidden="true">SL</div>
            <div class="profile-name">Sofía L.</div>
          </button>

          <button class="profile-card card-recep" type="button" onclick="handleProfileSelect('Mateo G.', 'RECEPTION', false)">
            <div class="avatar" aria-hidden="true">MG</div>
            <div class="profile-name">Mateo G.</div>
          </button>
        </div>

        <div class="reception-grid-row-2">
          <button class="profile-card card-recep" type="button" onclick="handleProfileSelect('Ana P.', 'RECEPTION', true)">
            <div class="avatar" aria-hidden="true">AP</div>
            <div class="profile-name">Ana P.</div>
          </button>

          <button class="profile-card card-recep" type="button" onclick="handleProfileSelect('Diego S.', 'RECEPTION', false)">
            <div class="avatar" aria-hidden="true">DS</div>
            <div class="profile-name">Diego S.</div>
          </button>

          <button class="profile-card card-recep" type="button" onclick="handleProfileSelect('Elena T.', 'RECEPTION', true)">
            <div class="avatar" aria-hidden="true">ET</div>
            <div class="profile-name">Elena T.</div>
          </button>
        </div>
      </section>
    </main>

    <!-- Footer Note -->
    <footer class="footer-note">
      <span>EvoGym · Operación de Gimnasio</span>
    </footer>

    <!-- Interactive Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span>✓</span> <span id="toast-msg">Accediendo...</span>
    </div>
  </div>

  <!-- Modal: PIN Entry for credentialed profiles -->
  <div class="modal-backdrop" id="pin-modal" role="dialog" aria-modal="true" aria-labelledby="modal-user-name">
    <div class="modal-card">
      <div class="modal-profile-header">
        <div class="modal-avatar" id="modal-avatar">A</div>
        <div class="modal-title" id="modal-user-name">Admin</div>
        <div class="modal-subtitle" id="modal-user-role">Ingresa tu PIN de 4 dígitos para continuar</div>
      </div>

      <div class="pin-display" aria-label="PIN ingresado">
        <div class="pin-slot" id="slot-0">•</div>
        <div class="pin-slot" id="slot-1">•</div>
        <div class="pin-slot" id="slot-2">•</div>
        <div class="pin-slot" id="slot-3">•</div>
      </div>

      <div class="pin-keypad" aria-label="Teclado numérico">
        <button class="key-btn" type="button" onclick="pressKey('1')">1</button>
        <button class="key-btn" type="button" onclick="pressKey('2')">2</button>
        <button class="key-btn" type="button" onclick="pressKey('3')">3</button>
        <button class="key-btn" type="button" onclick="pressKey('4')">4</button>
        <button class="key-btn" type="button" onclick="pressKey('5')">5</button>
        <button class="key-btn" type="button" onclick="pressKey('6')">6</button>
        <button class="key-btn" type="button" onclick="pressKey('7')">7</button>
        <button class="key-btn" type="button" onclick="pressKey('8')">8</button>
        <button class="key-btn" type="button" onclick="pressKey('9')">9</button>
        <button class="key-btn" type="button" onclick="clearPin()">C</button>
        <button class="key-btn" type="button" onclick="pressKey('0')">0</button>
        <button class="key-btn" type="button" onclick="backspacePin()">⌫</button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" type="button" onclick="submitPin()">Confirmar PIN</button>
      </div>
    </div>
  </div>

  <script>
    let activePin = '';
    let selectedProfile = null;

    // Clock simulation
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('current-time').textContent = `${hours}:${minutes} hrs`;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const dateStr = now.toLocaleDateString('es-MX', options);
      document.getElementById('current-date').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
    }
    updateClock();
    setInterval(updateClock, 30000);

    // Profile selection trigger
    function handleProfileSelect(name, role, hasPin) {
      selectedProfile = { name, role, hasPin };
      if (hasPin) {
        openModal(name, role);
      } else {
        // Direct access path (no PIN required)
        showToast(`Entrando directamente como ${name} (${role === 'ADMIN' ? 'Admin' : 'Recepción'})`);
      }
    }

    // Modal controls
    function openModal(name, role) {
      activePin = '';
      updatePinSlots();
      document.getElementById('modal-user-name').textContent = name;
      document.getElementById('modal-avatar').textContent = name === 'Admin' ? 'A' : name.split(' ').map(n => n[0]).join('');
      document.getElementById('modal-user-role').textContent = `${role === 'ADMIN' ? 'Perfil Administrador' : 'Perfil Recepción'} · Requiere PIN`;
      document.getElementById('pin-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('pin-modal').classList.remove('active');
      activePin = '';
      updatePinSlots();
    }

    function pressKey(num) {
      if (activePin.length < 4) {
        activePin += num;
        updatePinSlots();
      }
    }

    function backspacePin() {
      if (activePin.length > 0) {
        activePin = activePin.slice(0, -1);
        updatePinSlots();
      }
    }

    function clearPin() {
      activePin = '';
      updatePinSlots();
    }

    function updatePinSlots() {
      for (let i = 0; i < 4; i++) {
        const slot = document.getElementById(`slot-${i}`);
        if (i < activePin.length) {
          slot.textContent = '●';
          slot.classList.add('filled');
        } else {
          slot.textContent = '•';
          slot.classList.remove('filled');
        }
      }
    }

    function submitPin() {
      if (activePin.length === 4) {
        closeModal();
        showToast(`PIN verificado. Accediendo al sistema como ${selectedProfile.name}`);
      } else {
        alert('Por favor ingresa un PIN de 4 dígitos completo.');
      }
    }

    // Keyboard support for modal
    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('pin-modal');
      if (modal.classList.contains('active')) {
        if (e.key >= '0' && e.key <= '9') {
          pressKey(e.key);
        } else if (e.key === 'Backspace') {
          backspacePin();
        } else if (e.key === 'Escape') {
          closeModal();
        } else if (e.key === 'Enter') {
          submitPin();
        }
      }
    });

    // Toast feedback
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3200);
    }

    // Light / Dark mode toggle
    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');
    let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(isDark);

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      applyTheme(isDark);
    });

    function applyTheme(dark) {
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      themeBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
      themeBtn.setAttribute('aria-label', dark ? 'Usar tema claro' : 'Usar tema oscuro');
      themeIcon.innerHTML = dark
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;
    }
  </script>
</body>
</html>
