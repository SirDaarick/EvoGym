services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: evogym-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: evogym
      POSTGRES_PASSWORD: evogym_dev_password
      POSTGRES_DB: evogym_dev
    ports:
      # Use port 5433 on host to avoid conflicts with other local PostgreSQL instances
      - "${EVOGYM_POSTGRES_PORT:-5433}:5432"
    volumes:
      - evogym_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evogym -d evogym_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio_dev:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: evogym_dev
      MINIO_ROOT_PASSWORD: evogym_dev_password
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - evogym_minio_dev_data:/data

  minio_bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio_dev
    entrypoint: >-
      /bin/sh -c 'until mc alias set local http://minio_dev:9000 evogym_dev evogym_dev_password; do sleep 2; done;
      mc mb --ignore-existing local/evogym-expenses'

volumes:
  evogym_postgres_dev_data:
    name: evogym_postgres_dev_data
  evogym_minio_dev_data:
    name: evogym_minio_dev_data
