services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: evogym-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: evogym
      POSTGRES_PASSWORD: evogym_dev_password
      POSTGRES_DB: evogym_dev
    ports:
      # Use port 5433 on host to avoid conflicts with other local PostgreSQL instances
      - "${EVOGYM_POSTGRES_PORT:-5433}:5432"
    volumes:
      - evogym_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evogym -d evogym_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local S3-compatible storage for expense evidence. Any S3 server works:
  # this image is the one this machine can pull; MinIO or Cloudflare R2 only
  # change the EVOGYM_EVIDENCE_* settings.
  s3_dev:
    image: chrislusf/seaweedfs:latest
    command: server -s3
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8080:8080"
    volumes:
      - evogym_s3_dev_data:/data

volumes:
  evogym_postgres_dev_data:
    name: evogym_postgres_dev_data
  evogym_s3_dev_data:
    name: evogym_s3_dev_data
